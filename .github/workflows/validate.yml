name: Validate app package
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test credentials and discovery against the pinned application image
        run: >-
          docker run --rm --network none --entrypoint node
          --volume "$PWD/leoparm-mediadec/bootstrap.cjs.template:/bootstrap.cjs:ro"
          --volume "$PWD/leoparm-mediadec/discovery.cjs.template:/discovery.cjs:ro"
          --volume "$PWD/tests/bootstrap.test.cjs:/bootstrap.test.cjs:ro"
          --volume "$PWD/tests/discovery.test.cjs:/discovery.test.cjs:ro"
          leoparm/mediadec:0.1.7@sha256:88ded0e831757883fdfa1a98fe39ec4914087ad94fb83a0079bc9dfae5851833
          --test /bootstrap.test.cjs /discovery.test.cjs
  tradeshow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test Tradeshow setup, authentication and persistence in its pinned image
        run: >-
          docker run --rm --network none --entrypoint node
          --volume "$PWD/tests/tradeshow-image.test.cjs:/tradeshow-image.test.cjs:ro"
          leoparm/tradeshow:0.1.1@sha256:804ce66897bf26772fda742e31eed8c8c35661a4f6a803773b009abcb21848fe
          --test /tradeshow-image.test.cjs
