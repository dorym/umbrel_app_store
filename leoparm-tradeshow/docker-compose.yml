version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: leoparm-tradeshow_server_1
      APP_PORT: 3000
  server:
    image: leoparm/tradeshow:0.1.1@sha256:804ce66897bf26772fda742e31eed8c8c35661a4f6a803773b009abcb21848fe
    platform: linux/amd64
    init: true
    restart: on-failure
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      SQLITE_PATH: /app/data/tradeshow.db
      AUTH_SECRET: ${APP_SEED}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      AUTH_COOKIE_NAMESPACE: leoparm-tradeshow
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
