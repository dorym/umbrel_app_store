version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: leoparm-mediadec_server_1
      APP_PORT: 3000
  server:
    image: leoparm/mediadec:0.1.7@sha256:88ded0e831757883fdfa1a98fe39ec4914087ad94fb83a0079bc9dfae5851833
    platform: linux/amd64
    command:
      - /bin/sh
      - -ec
      - node /umbrel-bootstrap.cjs && (node /umbrel-discovery.cjs || true) && unset UMBREL_APP_PASSWORD && exec npm start
    init: true
    restart: on-failure
    environment:
      CACHE_DB_PATH: /db/cache.db
      MEDIA_ROOT: /Media
      UMBREL_APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/db:/db
      - ${APP_DATA_DIR}/data/media:/Media
      - ${APP_DATA_DIR}/bootstrap.cjs:/umbrel-bootstrap.cjs:ro
      - ${APP_DATA_DIR}/discovery.cjs:/umbrel-discovery.cjs:ro
